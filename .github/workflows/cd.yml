name: cd
on:
  push:
    branches: [main]
jobs:
  deploy:
    environment: myenvironment
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    permissions:
      contents: 'read'
      id-token: 'write'
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest && goose -version && which goose

      - name: Run db migrations
        run: ./scripts/migrateup.sh

      - name: Build
        run: "./scripts/buildprod.sh"

      - name: Debug GitHub identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/595919672549/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: cloud-run-deployer@notely-514407.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      - name: Submit build
        run: |
          gcloud builds submit \
            --tag us-central1-docker.pkg.dev/notely-514407/notely-ar-repo/notely:latest .
      
      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-514407/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-514407 --max-instances=4